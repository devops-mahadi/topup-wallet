# TopUpWallet infra — SQL Server, RabbitMQ, Redis, MongoDB.
# SQL Server 2022 runs natively on arm64 (Apple Silicon).
services:

  sqlserver:
    # Full SQL Server 2022 — now has native arm64 support, so it runs directly on
    # Apple Silicon (we dropped Azure SQL Edge, whose latest arm64 builds crash on
    # the master-DB upgrade step). Same T-SQL, port 1433.
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tw-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "TopUpWallet!2026"   # dev only — real secrets go in a vault
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "TopUpWallet!2026", "-C", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s # Gives MSSQL time to boot before failures count
    #volumes:
    #  - sqldata:/var/opt/mssql

  rabbitmq:
    # management image = broker + web UI on 15672 (guest/guest)
    image: rabbitmq:3-management
    container_name: tw-rabbitmq
    ports:
      - "5672:5672"     # AMQP (app connects here)
      - "15672:15672"   # management UI (browser)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tw-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    container_name: tw-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo-user
      MONGO_INITDB_ROOT_PASSWORD: "MyStrong!Password123"
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--username", "mongo-user", "--password", "MyStrong!Password123", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s # Gives MongoDB time to pre-allocate files on first boot
    #volumes:
    #  - mongodata:/data/db

  # ---- Application services (built from source) ----

  wallet-api:
    # Build context = repo root so the Dockerfile can see src/Shared too.
    build:
      context: .
      dockerfile: src/Wallet.Api/Dockerfile
    image: topup-wallet/wallet-api
    container_name: tw-wallet-api
    # Let the app crash if the DB isn't ready at boot; Docker restarts it until
    # the migration succeeds. Orchestrator owns restarts, not app-side retry code.
    restart: unless-stopped
    ports:
      - "5001:8080"
    environment:
      # Override appsettings connection strings to point at the compose service
      # names (not localhost — localhost inside a container is the container itself).
      # The __ syntax maps to the nested config key ConnectionStrings:Name.
      ConnectionStrings__WalletDb: "Server=sqlserver,1433;Database=WalletDb;User Id=sa;Password=TopUpWallet!2026;TrustServerCertificate=True;Encrypt=True"
      ConnectionStrings__Mongo: "mongodb://mongo-user:MyStrong!Password123@mongo:27017/?authSource=admin"
      ConnectionStrings__RabbitMq: "rabbitmq"
      # JWT signing key from the environment (shared across all 3 services). The
      # :- default keeps the demo runnable; set JWT_SIGNING_KEY (or a vault) in real envs.
      Jwt__SigningKey: "${JWT_SIGNING_KEY:-dev-only-signing-key-change-me-32bytes-minimum-abc123}"
      # OpenTelemetry: point this at any OTLP backend/collector to export traces+
      # metrics+logs (empty = instrumented but not exporting). e.g. http://otel-collector:4317
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      # Dev toggle: set OTEL_CONSOLE=true to print traces+metrics+logs to container logs.
      OTEL_CONSOLE: "${OTEL_CONSOLE:-false}"
    depends_on:
      rabbitmq:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
      mongo:
        condition: service_healthy

  topup-api:
    build:
      context: .
      dockerfile: src/TopUp.Api/Dockerfile
    image: topup-wallet/topup-api
    container_name: tw-topup-api
    restart: unless-stopped
    ports:
      - "5002:8080"
    environment:
      ConnectionStrings__Redis: "redis:6379"
      ConnectionStrings__RabbitMq: "rabbitmq"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:-dev-only-signing-key-change-me-32bytes-minimum-abc123}"
      # OpenTelemetry: point this at any OTLP backend/collector to export traces+
      # metrics+logs (empty = instrumented but not exporting). e.g. http://otel-collector:4317
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      # Dev toggle: set OTEL_CONSOLE=true to print traces+metrics+logs to container logs.
      OTEL_CONSOLE: "${OTEL_CONSOLE:-false}"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      sqlserver:
        condition: service_healthy

  # Issues JWT access + refresh tokens. Stateless (no DB/cache) — tokens are
  # self-expiring and validated by signature. Clients log in here, then call the
  # wallet/topup APIs with the access token as a Bearer header.
  auth-api:
    build:
      context: .
      dockerfile: src/Auth.Api/Dockerfile
    image: topup-wallet/auth-api
    container_name: tw-auth-api
    restart: unless-stopped
    ports:
      - "5003:8080"
    environment:
      Jwt__SigningKey: "${JWT_SIGNING_KEY:-dev-only-signing-key-change-me-32bytes-minimum-abc123}"
      # OpenTelemetry: point this at any OTLP backend/collector to export traces+
      # metrics+logs (empty = instrumented but not exporting). e.g. http://otel-collector:4317
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      # Dev toggle: set OTEL_CONSOLE=true to print traces+metrics+logs to container logs.
      OTEL_CONSOLE: "${OTEL_CONSOLE:-false}"

volumes:
  sqldata:
  mongodata:
