# TopUpWallet infra — SQL Server, RabbitMQ, Redis, MongoDB.
# arm64 (Apple Silicon): Azure SQL Edge is the ARM-native SQL Server.
services:

  sqlserver:
    # Azure SQL Edge = ARM-native, speaks the SQL Server protocol (T-SQL, port 1433).
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: tw-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "TopUpWallet!2026"   # dev only — real secrets go in a vault
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql

  rabbitmq:
    # management image = broker + web UI on 15672 (guest/guest)
    image: rabbitmq:3-management
    container_name: tw-rabbitmq
    ports:
      - "5672:5672"     # AMQP (app connects here)
      - "15672:15672"   # management UI (browser)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tw-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    container_name: tw-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  # ---- Application services (built from source) ----

  wallet-api:
    # Build context = repo root so the Dockerfile can see src/Shared too.
    build:
      context: .
      dockerfile: src/Wallet.Api/Dockerfile
    image: topup-wallet/wallet-api
    container_name: tw-wallet-api
    # Let the app crash if the DB isn't ready at boot; Docker restarts it until
    # the migration succeeds. Orchestrator owns restarts, not app-side retry code.
    restart: unless-stopped
    ports:
      - "5001:8080"
    environment:
      # Override appsettings connection strings to point at the compose service
      # names (not localhost — localhost inside a container is the container itself).
      # The __ syntax maps to the nested config key ConnectionStrings:Name.
      ConnectionStrings__WalletDb: "Server=sqlserver,1433;Database=WalletDb;User Id=sa;Password=TopUpWallet!2026;TrustServerCertificate=True;Encrypt=True"
      ConnectionStrings__Mongo: "mongodb://mongo:27017"
      ConnectionStrings__RabbitMq: "rabbitmq"
    depends_on:
      rabbitmq:
        condition: service_healthy
      sqlserver:
        condition: service_started
      mongo:
        condition: service_started

  topup-api:
    build:
      context: .
      dockerfile: src/TopUp.Api/Dockerfile
    image: topup-wallet/topup-api
    container_name: tw-topup-api
    restart: unless-stopped
    ports:
      - "5002:8080"
    environment:
      ConnectionStrings__Redis: "redis:6379"
      ConnectionStrings__RabbitMq: "rabbitmq"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  sqldata:
  mongodata:
